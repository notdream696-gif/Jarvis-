
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #050b18;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
}

header {
  width: 100%;
  padding: 20px;
  text-align: center;
  color: #35baff;
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 4px;
}

.core {
  width: 150px;
  height: 150px;
  margin: 25px auto;
  border-radius: 50%;
  border: 3px solid #168bd5;
  box-shadow: 0 0 25px #087acb, inset 0 0 25px #087acb;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #55caff;
  font-size: 35px;
}

#status {
  color: #55bfff;
  margin: 10px;
  font-size: 14px;
}

#chat {
  width: 92%;
  max-width: 600px;
  height: 40vh;
  overflow-y: auto;
  border: 1px solid #16466d;
  border-radius: 12px;
  padding: 12px;
  background: #081426;
}

.message {
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
  line-height: 1.7;
  white-space: pre-wrap;
}

.user { background: #103b60; }

.jarvis {
  background: #102438;
  border: 1px solid #17618e;
}

.controls {
  width: 92%;
  max-width: 600px;
  display: flex;
  gap: 8px;
  margin: 15px 0;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #17618e;
  background: #081426;
  color: white;
  font-size: 16px;
}

button {
  padding: 12px 16px;
  border: 1px solid #168bd5;
  border-radius: 10px;
  background: #103b60;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button:active { background: #176da8; }

.bottom {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
}
</style>
</head>

<body>

<header>J.A.R.V.I.S</header>

<div class="core">J</div>

<div id="status">النظام جاهز</div>

<div id="chat">
  <div class="message jarvis">
    مرحباً، أنا JARVIS. كيف يمكنني مساعدتك؟
  </div>
</div>

<div class="controls">
  <input id="message" type="text" placeholder="اكتب رسالتك هنا...">
  <button onclick="sendMessage()">إرسال</button>
</div>

<div class="bottom">
  <button id="voiceButton" onclick="toggleVoice()">تحدث</button>
  <button onclick="enableAudio()">تفعيل الصوت</button>
</div>

<script>
const API = "https://jarvis-s-ten.vercel.app";

let history = [];
let audioEnabled = false;
let recognition = null;
let voiceMode = false;
let processing = false;
let speaking = false;

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const statusText = document.getElementById("status");
const voiceButton = document.getElementById("voiceButton");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function setStatus(text) {
  statusText.textContent = text;
}

function startListening() {
  if (!voiceMode || processing || speaking || !recognition) return;

  try {
    recognition.start();
  } catch (error) {
    setTimeout(() => {
      if (voiceMode && !processing && !speaking) {
        try {
          recognition.start();
        } catch (e) {}
      }
    }, 500);
  }
}

function stopListening() {
  if (recognition) {
    try {
      recognition.stop();
    } catch (error) {}
  }
}

function toggleVoice() {
  if (voiceMode) {
    voiceMode = false;
    stopListening();
    voiceButton.textContent = "تحدث";
    setStatus("تم إيقاف الاستماع");
    return;
  }

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    setStatus("المتصفح لا يدعم التعرف على الصوت");
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "ar-IQ";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    if (voiceMode && !processing && !speaking) {
      setStatus("استمع إليك");
    }
  };

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;

    if (!transcript.trim()) return;

    input.value = transcript;
    stopListening();
    sendMessage();
  };

  recognition.onerror = (event) => {
    if (event.error === "not-allowed") {
      voiceMode = false;
      voiceButton.textContent = "تحدث";
      setStatus("اسمح للمتصفح باستخدام المايكروفون");
      return;
    }

    if (voiceMode && !processing && !speaking) {
      setStatus("خطأ المايكروفون");
    }
  };

  recognition.onend = () => {
    if (voiceMode && !processing && !speaking) {
      setTimeout(startListening, 400);
    }
  };

  voiceMode = true;
  voiceButton.textContent = "إيقاف الاستماع";
  startListening();
}

async function sendMessage() {
  const message = input.value.trim();

  if (!message || processing) return;

  processing = true;
  input.value = "";

  stopListening();

  addMessage(message, "user");
  setStatus("جار التفكير");

  try {
    const response = await fetch(API + "/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message,
        history
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "خطأ في الاتصال");
    }

    const answer = data.answer;

    addMessage(answer, "jarvis");

    history.push(
      { role: "user", content: message },
      { role: "assistant", content: answer }
    );

    history = history.slice(-12);

    if (audioEnabled) {
      await getAudio(answer);
    }

    processing = false;

    if (voiceMode) {
      setStatus("استمع إليك");
      setTimeout(startListening, 500);
    } else {
      setStatus("النظام جاهز");
    }

  } catch (error) {
    processing = false;
    addMessage("حدث خطأ " + error.message, "jarvis");

    if (voiceMode) {
      setTimeout(startListening, 500);
    } else {
      setStatus("حدث خطأ");
    }
  }
}

async function getAudio(text) {
  try {
    speaking = true;
    setStatus("جارفيس يتحدث");

    const response = await fetch(API + "/api/tts", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ text })
    });

    if (!response.ok) {
      throw new Error("خطأ في الصوت");
    }

    const blob = await response.blob();
    const audioUrl = URL.createObjectURL(blob);
    const audio = new Audio(audioUrl);

    await new Promise((resolve) => {
      audio.onended = resolve;
      audio.onerror = resolve;

      audio.play().catch(resolve);
    });

    URL.revokeObjectURL(audioUrl);

  } catch (error) {
    setStatus("تعذر تشغيل الصوت");
  } finally {
    speaking = false;
  }
}

async function enableAudio() {
  audioEnabled = true;
  setStatus("تم تفعيل الصوت");
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});
</script>

</body>
</html>
